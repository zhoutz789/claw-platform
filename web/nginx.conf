server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA history 模式：未知路径回退到 index.html，由前端路由接管
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 静态资源长缓存（带 contenthash 的文件名）
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # 可选：前端构建产物健康检查
    location /healthz {
        access_log off;
        return 200 "ok\n";
    }
}
