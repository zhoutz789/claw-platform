<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Claw · 新能源资产 App 首页原型</title>
<style>
  :root{
    --bg:#0c1410; --panel:#121d18; --panel2:#16241d; --line:#22362c;
    --green:#19c37d; --green-d:#0f9d63; --lime:#7ef0b0; --amber:#f5b14c;
    --txt:#e9f3ee; --muted:#8aa79a; --blue:#4ea8ff; --red:#ff7a7a;
    --radius:16px;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
    background:radial-gradient(1200px 600px at 80% -10%,#16352a 0%,var(--bg) 60%);
    color:var(--txt);min-height:100vh;padding:0 0 80px}
  .app{max-width:440px;margin:0 auto;background:var(--bg);min-height:100vh;position:relative}
  /* header */
  .topbar{padding:18px 16px 14px;background:linear-gradient(160deg,#16352a,#0e1a14)}
  .hrow{display:flex;align-items:center;gap:10px}
  .logo{width:34px;height:34px;border-radius:10px;background:linear-gradient(135deg,var(--green),#0b7a4d);
    display:flex;align-items:center;justify-content:center;font-weight:800;color:#04140d;font-size:17px;box-shadow:0 4px 14px rgba(25,195,125,.35)}
  .hbrand{font-size:17px;font-weight:800}
  .hi{margin-left:auto;width:34px;height:34px;border-radius:50%;background:var(--panel2);border:1px solid var(--line);
    display:flex;align-items:center;justify-content:center;font-size:15px}
  .locbar{margin-top:12px;display:flex;align-items:center;gap:8px;background:rgba(0,0,0,.25);
    border:1px solid var(--line);border-radius:12px;padding:9px 12px;cursor:pointer}
  .locbar .lp{font-size:18px}
  .locbar .la{font-size:14px;font-weight:700}
  .locbar .ls{font-size:11px;color:var(--muted)}
  .locbar .chev{margin-left:auto;color:var(--muted);font-size:13px}
  /* cascade */
  .cascade{display:none;position:fixed;left:50%;top:90px;transform:translateX(-50%);width:410px;max-width:92vw;z-index:20;
    background:var(--panel);border:1px solid var(--green);border-radius:14px;padding:14px;box-shadow:0 20px 60px rgba(0,0,0,.5)}
  .cascade.open{display:block}
  .cascade .row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .cascade label{display:block;font-size:11.5px;color:var(--muted);margin-bottom:5px}
  .cascade select{width:100%;background:var(--panel2);border:1px solid var(--line);color:var(--txt);border-radius:9px;padding:9px;font-size:13px;outline:none}
  .cascade .mbtn{margin-top:12px;width:100%;background:linear-gradient(135deg,var(--green),var(--green-d));color:#042017;border:none;border-radius:10px;padding:11px;font-weight:700;cursor:pointer}
  /* sections */
  .body{padding:14px 14px 0}
  .sec{margin-bottom:16px}
  .sectitle{font-size:13px;color:var(--lime);margin:4px 4px 10px;display:flex;align-items:center;gap:7px}
  .sectitle::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--green);box-shadow:0 0 8px var(--green)}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:14px}
  /* battery asset */
  .bat{display:flex;align-items:center;gap:14px}
  .ring{width:62px;height:62px;border-radius:50%;background:conic-gradient(var(--green) 0 88%,#243a30 88%);
    display:flex;align-items:center;justify-content:center;position:relative;flex-shrink:0}
  .ring::after{content:"";position:absolute;inset:7px;border-radius:50%;background:var(--panel)}
  .ring b{position:relative;font-size:15px;color:var(--lime);font-weight:800}
  .bat .info{flex:1}
  .bat .info .bn{font-size:14px;font-weight:700}
  .bat .info .bs{font-size:12px;color:var(--muted);margin-top:3px}
  .tag{display:inline-block;font-size:10.5px;padding:2px 8px;border-radius:999px;font-weight:700;margin-top:6px}
  .tag.on{background:var(--green);color:#042017}
  .tag.rent{background:#1d3a5c;color:#bcdcff}
  /* swap stations */
  .st{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px dashed var(--line)}
  .st:last-child{border-bottom:none}
  .st .sd{width:40px;height:40px;border-radius:11px;background:var(--panel2);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:19px}
  .st .sn{flex:1}
  .st .sn .t{font-size:13.5px;font-weight:700}
  .st .sn .d{font-size:11.5px;color:var(--muted);margin-top:2px}
  .st .av{text-align:right}
  .st .av .n{font-size:14px;font-weight:800;color:var(--lime)}
  .st .av .l{font-size:10px;color:var(--muted)}
  .swapbtn{margin-top:2px;background:linear-gradient(135deg,var(--green),var(--green-d));color:#042017;border:none;border-radius:9px;padding:6px 11px;font-size:12px;font-weight:700;cursor:pointer}
  /* economy + finance split */
  .twocol{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .kpi{background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:12px}
  .kpi .kl{font-size:11px;color:var(--muted)}
  .kpi .kv{font-size:18px;font-weight:800;color:var(--lime);margin-top:5px}
  .kpi .kv.amber{color:var(--amber)}
  .kpi .ks{font-size:10.5px;color:var(--muted);margin-top:3px}
  /* tabbar */
  .tabbar{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:440px;max-width:100%;
    display:flex;background:rgba(14,24,20,.96);border-top:1px solid var(--line);backdrop-filter:blur(8px)}
  .tab{flex:1;text-align:center;padding:9px 0;font-size:10.5px;color:var(--muted);cursor:pointer}
  .tab .ti{font-size:18px;display:block;margin-bottom:2px}
  .tab.active{color:var(--lime)}
  .tab.active .ti{filter:drop-shadow(0 0 6px var(--green))}
  .muted{color:var(--muted);font-size:11px;text-align:center;margin-top:18px}
</style>
</head>
<body>
<div class="app">
  <div class="topbar">
    <div class="hrow">
      <div class="logo">⚡</div>
      <div class="hbrand">Claw 新能源资产</div>
      <div class="hi">🔔</div>
    </div>
    <div class="locbar" id="locbar">
      <div class="lp">📍</div>
      <div>
        <div class="la" id="locAddr">定位中…</div>
        <div class="ls" id="locSub">正在获取您的位置</div>
      </div>
      <div class="chev">▾ 切换</div>
    </div>
  </div>

  <div class="body">
    <!-- 我的电池资产 -->
    <div class="sec">
      <div class="sectitle">我的电池资产</div>
      <div class="card">
        <div class="bat">
          <div class="ring"><b>88%</b></div>
          <div class="info">
            <div class="bn">电池 #BT-2026-KHM-0481</div>
            <div class="bs">三元锂 · 72V/60Ah · 健康度 92% · 归属 人人经济池</div>
            <span class="tag on">在用电车中</span>
          </div>
        </div>
      </div>
    </div>

    <!-- 附近换电站 -->
    <div class="sec">
      <div class="sectitle">附近换电站（按当前位置）</div>
      <div class="card" id="stations"></div>
    </div>

    <!-- 人人经济 + 车辆分期 -->
    <div class="sec">
      <div class="sectitle">人人经济收益 / 车辆分期</div>
      <div class="twocol">
        <div class="kpi"><div class="kl">本月收益</div><div class="kv amber">$138.50</div><div class="ks">角色：资产合伙人 · 累计 $2,140</div></div>
        <div class="kpi"><div class="kl">我的车辆月供</div><div class="kv">$96.00</div><div class="ks">电动摩托 #EM-0392 · 剩 11/12 期</div></div>
      </div>
    </div>

    <div class="muted">原型仅用于视觉与交互验收 · 数据均为演示</div>
  </div>

  <!-- 地址级联 -->
  <div class="cascade" id="cascade">
    <div class="row">
      <div><label>国家</label><select id="selCountry"></select></div>
      <div><label>省 / 州</label><select id="selProv"></select></div>
    </div>
    <div class="row" style="margin-top:10px">
      <div><label>市</label><select id="selCity"></select></div>
      <div><label>区 / 县</label><select id="selCounty"></select></div>
    </div>
    <button class="mbtn" id="applyLoc">确定此地址</button>
  </div>

  <div class="tabbar">
    <div class="tab active"><span class="ti">🏠</span>首页</div>
    <div class="tab"><span class="ti">🔋</span>换电</div>
    <div class="tab"><span class="ti">💰</span>资产</div>
    <div class="tab"><span class="ti">👤</span>我的</div>
  </div>
</div>

<script>
const COUNTRIES={
  KHM:{n:"柬埔寨",f:"🇰🇭"},CHN:{n:"中国",f:"🇨🇳"},USA:{n:"美国",f:"🇺🇸"},
  DEU:{n:"德国",f:"🇩🇪"},JPN:{n:"日本",f:"🇯🇵"},VNM:{n:"越南",f:"🇻🇳"},THA:{n:"泰国",f:"🇹🇭"},RUS:{n:"俄罗斯",f:"🇷🇺"}
};
const CTRY_ORDER=Object.keys(COUNTRIES);
const ADDR={
  KHM:{ "金边":{ "金边市":["隆边区","桑园区","玛卡拉区"] }, "暹粒省":{ "暹粒市":["暹粒县"] } },
  CHN:{ "广东省":{ "深圳市":["南山区","福田区"], "广州市":["天河区"] }, "北京市":{ "北京市":["朝阳区","海淀区"] } },
  USA:{ "加利福尼亚":{ "洛杉矶县":["洛杉矶市","长滩"] } },
  DEU:{ "巴伐利亚":{ "慕尼黑":["市中心","郊区"] } },
  JPN:{ "东京都":{ "东京市":["千代田区"] } },
  VNM:{ "胡志明市":{ "胡志明市":["第一郡"] } },
  THA:{ "曼谷":{ "曼谷市":["巴吞旺"] } },
  RUS:{ "莫斯科":{ "莫斯科市":["中央区"] } }
};
const STATIONS={
  KHM:[
    {n:"金边·桑园区换电站",d:"距您 0.8 km",a:12},
    {n:"金边·隆边区换电站",d:"距您 1.6 km",a:5},
    {n:"金边·玛卡拉换电站",d:"距您 2.3 km",a:0}
  ],
  CHN:[
    {n:"深圳·南山科技园站",d:"距您 1.1 km",a:24},
    {n:"深圳·福田CBD站",d:"距您 2.0 km",a:9},
    {n:"广州·天河体育西站",d:"距您 6.4 km",a:15}
  ],
  USA:[{n:"LA·Downtown Swap",d:"距您 2.1 km",a:7}],
  DEU:[{n:"München Zentrum",d:"距您 1.4 km",a:6}],
  JPN:[{n:"Tokyo Chiyoda",d:"距您 0.9 km",a:10}],
  VNM:[{n:"HCMC Quan 1",d:"距您 1.2 km",a:8}],
  THA:[{n:"Bangkok Pathumwan",d:"距您 1.0 km",a:11}],
  RUS:[{n:"Moscow Central",d:"距您 1.7 km",a:4}]
};
const $=id=>document.getElementById(id);
const selCountry=$("selCountry"),selProv=$("selProv"),selCity=$("selCity"),selCounty=$("selCounty");
let current={c:"KHM",p:"金边",ci:"金边市",co:"桑园区"};
function fill(sel,arr,ph,dis){sel.innerHTML="";if(ph)sel.add(new Option(ph,""));arr.forEach(x=>sel.add(new Option(x,x)));sel.disabled=!!dis;}
function refreshCascade(){fill(selCountry,CTRY_ORDER.map(c=>COUNTRIES[c].f+" "+COUNTRIES[c].n));selCountry.value=current.c;
  const ps=Object.keys(ADDR[current.c]||{});fill(selProv,ps,ps.length?"省/州":null,!ps.length);selProv.value=ps[0];refreshCity();}
function refreshCity(){const ps=ADDR[current.c]||{};const cs=Object.keys(ps[selProv.value]||{});fill(selCity,cs,cs.length?"市":null,!cs.length);selCity.value=cs[0];refreshCounty();}
function refreshCounty(){const cs=(ADDR[current.c]||{})[selProv.value]||{};const ks=cs[selCity.value]||[];fill(selCounty,ks,ks.length?"区/县":null,!ks.length);selCounty.value=ks[0];}
selCountry.onchange=()=>{current.c=selCountry.value;refreshCascade();};selProv.onchange=refreshCity;selCity.onchange=refreshCounty;
function locLabel(o){return [COUNTRIES[o.c].n,o.p,o.ci,o.co].filter(Boolean).join(" · ");}
function renderStations(c){const arr=STATIONS[c]||[];$("stations").innerHTML=arr.map(s=>`<div class="st">
  <div class="sd">🔋</div><div class="sn"><div class="t">${s.n}</div><div class="d">${s.d}</div></div>
  <div class="av"><div class="n">${s.a}</div><div class="l">可用电池</div></div>
  <button class="swapbtn">${s.a>0?"扫码换电":"已租满"}</button></div>`).join("");}
function setAddr(o,sub){current=o;$("locAddr").textContent=locLabel(o);if(sub)$("locSub").textContent=sub;renderStations(o.c);}
$("locbar").onclick=()=>{const c=$("cascade");c.classList.toggle("open");if(c.classList.contains("open"))refreshCascade();};
$("applyLoc").onclick=()=>{const o={c:selCountry.value,p:selProv.value,ci:selCity.value,co:selCounty.value};
  setAddr(o,"已手动选择");$("cascade").classList.remove("open");};
function simulate(){setTimeout(()=>setAddr({c:"KHM",p:"金边",ci:"金边市",co:"桑园区"},"已根据您的位置自动匹配（演示）"),700);}
refreshCascade();simulate();
</script>
</body>
</html>
