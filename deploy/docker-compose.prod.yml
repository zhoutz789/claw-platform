# Claw 生产编排（单主机 Docker Compose）
# 版本切换：改 deploy/.env.prod 里的 CLAW_VERSION，再 `docker compose -f deploy/docker-compose.prod.yml --env-file deploy/.env.prod up -d`
# 或直接使用 scripts/deploy-version.sh deploy <版本号>
#
# 镜像命名约定（见 scripts/deploy-version.sh 与 CI）：
#   backend: ${DOCKER_REGISTRY}/claw-backend:<git tag>
#   web:     ${DOCKER_REGISTRY}/claw-web:<git tag>
# 两个服务使用同一 CLAW_VERSION，保证前后端版本对齐。

services:
  # ---------- 基础设施 ----------
  postgres:
    image: timescale/timescaledb:latest-pg16
    container_name: claw-postgres
    environment:
      POSTGRES_DB: ${DB_NAME:-claw}
      POSTGRES_USER: ${DB_USER:-claw}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-claw} -d ${DB_NAME:-claw}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: claw-redis
    volumes:
      - redis_data:/data
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: claw-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${MQ_USER:-claw}
      RABBITMQ_DEFAULT_PASS: ${MQ_PASSWORD}
    volumes:
      - mq_data:/var/lib/rabbitmq
    restart: unless-stopped

  # EMQX：车机/电池 BMS/无人机 MQTT 接入所需。资源占用较大，
  # 若初期不上 IoT 可整段注释以节省内存；启用后按需对外暴露 1883/8883。
  emqx:
    image: emqx/emqx:5.8
    container_name: claw-emqx
    restart: unless-stopped

  # ---------- 应用 ----------
  backend:
    image: ${DOCKER_REGISTRY:-claw}/claw-backend:${CLAW_VERSION:-latest}
    container_name: claw-backend
    environment:
      SPRING_PROFILES_ACTIVE: default
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-claw}
      DB_USER: ${DB_USER:-claw}
      DB_PASSWORD: ${DB_PASSWORD}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      MQ_HOST: rabbitmq
      MQ_PORT: 5672
      MQ_USER: ${MQ_USER:-claw}
      MQ_PASSWORD: ${MQ_PASSWORD}
      # 安全密钥（生产必须为强随机值；建议用 Docker secrets / 云密钥管理，不要写进可提交文件）
      CLAW_JWT_SECRET: ${CLAW_JWT_SECRET}
      CLAW_ID_CARD_KEY: ${CLAW_ID_CARD_KEY}
      CLAW_PAYMENT_CALLBACK_SECRET: ${CLAW_PAYMENT_CALLBACK_SECRET}
      # 支付网关回调必须配置共享密钥（fail-closed）；dev-open-access 在生产必须为 false
      claw.security.dev-open-access: "false"
      TZ: Asia/Shanghai
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/actuator/health | grep -q UP || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s
    restart: unless-stopped

  web:
    image: ${DOCKER_REGISTRY:-claw}/claw-web:${CLAW_VERSION:-latest}
    container_name: claw-web
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/healthz >/dev/null 2>&1 || exit 1"]
      interval: 20s
      timeout: 3s
      retries: 3
    restart: unless-stopped

  # ---------- 网关（TLS 终止 + 反向代理）----------
  gateway:
    image: nginx:1.27-alpine
    container_name: claw-gateway
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/gateway.conf:/etc/nginx/conf.d/default.conf:ro
      # 生产：放入 Let's Encrypt / 云证书（fullchain.pem + privkey.pem）
      # 自测可用 deploy/ssl 下的 server.pem/server.key（需改名挂载，见方案文档）
      - ./ssl:/etc/nginx/ssl:ro
    depends_on:
      - web
      - backend
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/healthz >/dev/null 2>&1 || exit 1"]
      interval: 20s
      timeout: 3s
      retries: 3
    restart: unless-stopped

volumes:
  pg_data:
  redis_data:
  mq_data:
