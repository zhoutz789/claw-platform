# Claw 测试环境编排（腾讯云轻量应用服务器 · 单主机 Docker Compose）
#
# 与 docker-compose.prod.yml 的差异（仅测试用途，故有意为之）：
#   1. 对外只暴露一个高位端口 8888（gateway，免 TLS），避开大陆地域 80/443 的备案与端口管控
#   2. 为每个服务显式设置 mem_limit —— 宿主 4C4G，若不限内存，backend 的
#      -XX:MaxRAMPercentage=75 会按 3.7GB 宿主机内存计算（堆上限约 2.8GB），必与
#      DB/MQ 抢内存并触发 OOM
#   3. 全服务配置日志轮转（max-size/max-file）—— 旧机器上 /var/log 曾堆到 3.5GB
#   4. 数据库/缓存/MQ/EMQX 一律不对宿主暴露端口，仅容器内网互联
#
# 用法：
#   cd /opt/claw/deploy
#   docker compose -f docker-compose.test.yml --env-file /opt/claw/.env.test up -d
#
# 构建镜像（在服务器上本地构建，产物 tag 与下方 image 对齐）：
#   docker build -t claw/claw-backend:test ../backend
#   docker build -t claw/claw-web:test     ../web

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  # ---------- 基础设施 ----------
  postgres:
    image: timescale/timescaledb:latest-pg16
    container_name: claw-postgres
    command: ["postgres", "-c", "shared_buffers=192MB", "-c", "max_connections=80", "-c", "effective_cache_size=512MB"]
    environment:
      POSTGRES_DB: ${DB_NAME:-claw}
      POSTGRES_USER: ${DB_USER:-claw}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      TZ: Asia/Shanghai
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-claw} -d ${DB_NAME:-claw}"]
      interval: 5s
      timeout: 3s
      retries: 20
    mem_limit: 700m
    logging: *default-logging
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: claw-redis
    command: ["redis-server", "--maxmemory", "96mb", "--maxmemory-policy", "allkeys-lru"]
    volumes:
      - redis_data:/data
    mem_limit: 96m
    logging: *default-logging
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: claw-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${MQ_USER:-claw}
      RABBITMQ_DEFAULT_PASS: ${MQ_PASSWORD}
      TZ: Asia/Shanghai
    volumes:
      - mq_data:/var/lib/rabbitmq
    mem_limit: 320m
    logging: *default-logging
    restart: unless-stopped

  # EMQX：车机 / 电池 BMS / 无人机 MQTT 接入。
  # 若该容器反复重启（内存不足），把本段整体注释掉即可 —— 不做 IoT 接入时后端不依赖它。
  emqx:
    image: emqx/emqx:5.8
    container_name: claw-emqx
    environment:
      EMQX_NODE__NAME: emqx@127.0.0.1
      EMQX_DASHBOARD__DEFAULT_PASSWORD: ${EMQX_DASHBOARD_PASSWORD:-clawtest}
      TZ: Asia/Shanghai
    mem_limit: 640m
    logging: *default-logging
    restart: unless-stopped

  # ---------- 应用 ----------
  backend:
    image: ${DOCKER_REGISTRY:-claw}/claw-backend:${CLAW_VERSION:-test}
    container_name: claw-backend
    environment:
      SPRING_PROFILES_ACTIVE: default
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-claw}
      DB_USER: ${DB_USER:-claw}
      DB_PASSWORD: ${DB_PASSWORD}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      MQ_HOST: rabbitmq
      MQ_PORT: 5672
      MQ_USER: ${MQ_USER:-claw}
      MQ_PASSWORD: ${MQ_PASSWORD}
      CLAW_JWT_SECRET: ${CLAW_JWT_SECRET}
      CLAW_ID_CARD_KEY: ${CLAW_ID_CARD_KEY}
      CLAW_PAYMENT_CALLBACK_SECRET: ${CLAW_PAYMENT_CALLBACK_SECRET}
      # 测试环境同样关闭 dev 全放行：验证真实权限链路才有效
      claw.security.dev-open-access: "false"
      TZ: Asia/Shanghai
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/actuator/health | grep -q UP || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 90s
    mem_limit: 1152m
    logging: *default-logging
    restart: unless-stopped

  web:
    image: ${DOCKER_REGISTRY:-claw}/claw-web:${CLAW_VERSION:-test}
    container_name: claw-web
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/healthz >/dev/null 2>&1 || exit 1"]
      interval: 20s
      timeout: 3s
      retries: 3
    mem_limit: 64m
    logging: *default-logging
    restart: unless-stopped

  # ---------- 网关（对外唯一入口，HTTP，免 TLS）----------
  gateway:
    image: nginx:1.27-alpine
    container_name: claw-gateway
    ports:
      - "8888:80"
    volumes:
      - ./nginx/gateway-test.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - web
      - backend
    mem_limit: 48m
    logging: *default-logging
    restart: unless-stopped

volumes:
  pg_data:
  redis_data:
  mq_data:
