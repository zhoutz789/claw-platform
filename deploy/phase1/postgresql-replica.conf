# Phase 1 副本配置（原型）
listen_addresses = '*'
port = 5432
max_connections = 200

wal_level = replica
hot_standby = on

# 主连接信息由 pg_basebackup -R 写入 postgresql.auto.conf
# （standby.signal + primary_conninfo -> 自动以流复制 standby 身份启动）。

# 流中断时从共享归档卷补 WAL，演示 PITR/断点续传能力。
restore_command = 'cp /mnt/archive/%f %p'

shared_buffers = 256MB
effective_cache_size = 768MB
