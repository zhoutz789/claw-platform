# Phase 1 本地可运行原型：PostgreSQL 主库 + 流复制副本 + WAL 归档到对象存储(MinIO 模拟异地)
# 端口：主库 6432 / 副本 6433 / MinIO 9000(console 9001) —— 不与现有 5432/8080/5173 冲突。
# 运行：deploy/phase1/setup.sh   清理：deploy/phase1/teardown.sh   演练：scripts/phase1-dr-drill.sh

services:
  pg-primary:
    image: postgres:16
    container_name: phase1-pg-primary
    environment:
      POSTGRES_DB: claw
      POSTGRES_USER: claw
      POSTGRES_PASSWORD: claw_dev_password
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "6432:5432"
    volumes:
      - pg_primary:/var/lib/postgresql/data
      - ./docker-entrypoint-primary.sh:/entrypoint-primary.sh:ro
      - ./postgresql-primary.conf:/etc/postgresql/postgresql.conf:ro
      - ./pg_hba_primary.conf:/etc/postgresql/pg_hba.conf:ro
      - pg_archive:/mnt/archive
    command: ["sh", "/entrypoint-primary.sh"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U claw -d claw"]
      interval: 5s
      timeout: 3s
      retries: 10

  # 副本：首次启动若数据目录为空，自动用 pg_basebackup -R 引导为 standby（自举）。
  pg-replica:
    image: postgres:16
    container_name: phase1-pg-replica
    environment:
      POSTGRES_DB: claw
      POSTGRES_USER: claw
      POSTGRES_PASSWORD: claw_dev_password
      PGDATA: /var/lib/postgresql/data/pgdata
      PRIMARY_HOST: pg-primary
    ports:
      - "6433:5432"
    volumes:
      - pg_replica:/var/lib/postgresql/data
      - ./docker-entrypoint-replica.sh:/entrypoint-replica.sh:ro
      - ./postgresql-replica.conf:/etc/postgresql/postgresql.conf:ro
      - ./pg_hba_replica.conf:/etc/postgresql/pg_hba.conf:ro
      - pg_archive:/mnt/archive
    command: ["sh", "/entrypoint-replica.sh"]
    depends_on:
      - pg-primary

  # 对象存储（模拟异地备份目标；生产替换为 OSS/S3 并开启跨区复制）
  minio:
    image: minio/minio:latest
    container_name: phase1-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

  # —— 摄像头域（增量）：边缘媒体节点 ——
  # SRS 作 P0 边缘媒体网关：接收 RTMP 推流，产出 HLS(浏览器原生) / 预留 WebRTC。
  # 生产由自建 edge-media 网关前置 SRS，统一暴露 /hls、/rtc（见技术方案 v1）。
  edge-media:
    image: ossrs/srs:5
    container_name: phase1-edge-media
    ports:
      - "1935:1935"       # RTMP 接入
      - "11985:1985"      # SRS API
      - "18080:8080"      # HTTP / HLS / WebRTC
      - "8000:8000/udp"   # WebRTC UDP
    command: ["/usr/local/srs/objs/srs", "-c", "/usr/local/srs/conf/srs.conf"]
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:8080/rtc/v1/version || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10

  # 模拟摄像头：ffmpeg 生成测试画面 + 音轨，循环推 RTMP 到 edge-media/live/cam1。
  # 无需真实摄像头即可验证「推流 → 转码 → HLS」整链。
  mock-camera:
    image: linuxserver/ffmpeg:latest
    container_name: phase1-mock-camera
    command: ["sh", "-c", "while true; do ffmpeg -re -f lavfi -i testsrc=size=640x360:rate=25 -f lavfi -i sine=frequency=440:sample_rate=44100 -c:v libx264 -preset ultrafast -pix_fmt yuv420p -c:a aac -f flv rtmp://edge-media:1935/live/cam1; sleep 2; done"]
    depends_on:
      - edge-media

  # 边缘 recorder 模拟器：周期向后端上报「视频段索引」（写 V91 索引表 + 验证 V92 种子相机 id=1）。
  # 对象存储落盘为 P1；此处仅 POST 合成 objectKey + size 证明写路径端到端打通。
  # 需先拿带 camera:manage 的 token 写入 CLAW_TOKEN（见 README）。
  camera-recorder:
    image: python:3.11-slim
    container_name: phase1-camera-recorder
    working_dir: /app
    volumes:
      - ./camera-recorder.py:/app/camera-recorder.py:ro
    command: ["python3", "/app/camera-recorder.py"]
    environment:
      CLAW_BACKEND: http://host.docker.internal:8080
      CLAW_TOKEN: ${CLAW_TOKEN:-}
      CAMERA_ID: "1"
      INTERVAL_SEC: "30"
    depends_on:
      - edge-media
    restart: unless-stopped

volumes:
  pg_primary:
  pg_replica:
  pg_archive:
  minio_data:
