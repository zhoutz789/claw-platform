# Phase 1 主库配置（原型）
listen_addresses = '*'
port = 5432
max_connections = 200

# —— 复制与归档（核心：支撑副本 + 异地备份）——
wal_level = replica
archive_mode = on
# 原型：WAL 归档到共享卷 /mnt/archive（= 本地 staging）。
# 生产：改为直接推送到异地对象存储，例如：
#   archive_command = 'mc cp %p localminio/claw-wal-archive/%f'
#   或 aws s3 cp %p s3://claw-wal-archive/%f
# 只要文件成功落到异地，即满足"异地备份"要求；再开启对象存储跨区复制即双异地。
archive_command = 'test ! -f /mnt/archive/%f && cp %p /mnt/archive/%f'
archive_timeout = 60            # 空窗期也定时切换，保证 WAL 持续落盘可被归档

max_wal_senders = 10
max_replication_slots = 10
wal_keep_size = 1GB

# —— 热备：副本可承接只读流量 ——
hot_standby = on

# —— 零丢失策略（CAP 取舍，见《分布式部署详细设计》）——
# 生产对核心账户/账本库追加：
#   synchronous_standby_names = '*'
# 使提交在至少一个同步副本落盘后才返回，保证主库宕机零丢失。
# 本原型保持 asynchronous（synchronous_commit=on 仅保证本地 fsync），
# 以免副本异常时阻塞主库，便于演示与排错。
synchronous_commit = on

# —— 常规性能 ——
shared_buffers = 256MB
effective_cache_size = 768MB
