# Claw 测试环境网关（HTTP，免 TLS）
# 容器内监听 80，由 docker-compose.test.yml 映射为宿主 8888。
# 前端静态由 web 容器托管，后端 API 由 backend:8080 提供，二者同源经此网关收敛。
#
# 说明：测试环境不启用 TLS —— 大陆地域部署在 80/443 上会牵扯备案与端口管控，
# 这里统一走高位端口 8888，证书待正式部署再挂。

upstream claw_backend {
    server backend:8080;
    keepalive 32;
}

upstream claw_web {
    server web:80;
}

server {
    listen 80;
    server_name _;

    # 上传体积上限（合格证/图片等）
    client_max_body_size 20m;

    # 安全响应头
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;

    # 网关自身存活探测（供外部确认服务已起）
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    # 后端 API：原样透传（后端控制器映射在 /api/v1/**，故此处不能剥掉 /api 前缀）
    # ⚠️ upstream 末尾必须无斜杠：写成 http://claw_backend/ 会让 nginx 用 / 替换掉
    #    location 前缀 /api/，请求变成 /v1/**，落到 Spring Security 的 anyRequest()
    #    上被拒（空 body 403），前端所有接口全挂。
    location /api/ {
        proxy_pass http://claw_backend;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection         "";
        proxy_read_timeout 60s;
    }

    # 健康检查只允许本机访问（在服务器上 curl 127.0.0.1 查看）
    location /actuator/health {
        proxy_pass http://claw_backend;
        allow 127.0.0.1;
        deny all;
    }

    # 前端 SPA：其余全交给 web 容器（内含 history 回退）
    location / {
        proxy_pass http://claw_web;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
