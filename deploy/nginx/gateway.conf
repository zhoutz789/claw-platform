# Claw 网关：TLS 终止 + 反向代理
# 前端静态由 web 容器托管，后端 API 由 backend:8080 提供。
# 证书默认从 /etc/nginx/ssl 挂载（生产用 Let's Encrypt / 云证书，文件名 fullchain.pem + privkey.pem）。

upstream claw_backend {
    server backend:8080;
    keepalive 32;
}

upstream claw_web {
    server web:80;
}

server {
    listen 443 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/ssl/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    # 安全响应头
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;

    # 后端 API：/api 与 actuator/swagger 透传
    location /api/ {
        proxy_pass http://claw_backend/;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection         "";
        proxy_read_timeout 60s;
    }

    location /actuator/health {
        proxy_pass http://claw_backend;
        allow 127.0.0.1;
        deny all;
    }

    # 前端 SPA：其余全交给 web 容器（内含 history 回退）
    location / {
        proxy_pass http://claw_web;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# HTTP 80 强制跳转 HTTPS
server {
    listen 80;
    server_name _;
    return 301 https://$host$request_uri;
}
