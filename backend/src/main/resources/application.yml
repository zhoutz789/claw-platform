spring:
  application:
    name: claw-server
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:claw}
    username: ${DB_USER:claw}
    password: ${DB_PASSWORD:claw_dev_password}
    hikari:
      maximum-pool-size: 20
      connection-timeout: 5000
  jpa:
    hibernate:
      # 表结构一律由 Flyway 管理（V1–V16 已全量应用），禁止 Hibernate 自动建表。
      # 注意：实体与迁移在 CHAR/VARCHAR、NUMERIC 精度等类型声明上存在历史漂移，
      # 在从未对接真实 PostgreSQL 的项目中 validate 会逐项阻塞启动；
      # Flyway 已完整掌管 schema，故此处用 none（Flyway 管 schema 的推荐搭配），
      # 不丢任何表结构控制权，仅跳过 Hibernate 的类型二次校验。
      ddl-auto: none
    open-in-view: false
    properties:
      hibernate:
        default_schema: claw
  flyway:
    enabled: true
    schemas: claw
    default-schema: claw
    locations: classpath:db/migration
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  rabbitmq:
    host: ${MQ_HOST:localhost}
    port: ${MQ_PORT:5672}
    username: ${MQ_USER:claw}
    password: ${MQ_PASSWORD:claw_dev_password}

server:
  port: 8080

claw:
  security:
    # JWT 签名密钥（生产必须通过环境变量 CLAW_JWT_SECRET 注入，长度 ≥ 32 字节）
    jwt-secret: ${CLAV_JWT_SECRET:dev-only-insecure-secret-please-override-in-prod-0123456789}
    jwt-ttl-minutes: 1440            # 登录态有效期 24h
    # dev 环境短信验证码 stub：直接把验证码回显给客户端，便于联调（生产关闭）
    sms-dev-echo: true

springdoc:
  swagger-ui:
    path: /swagger-ui.html

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when_authorized

logging:
  level:
    com.claw: INFO
    org.flywaydb: INFO
