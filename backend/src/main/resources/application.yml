spring:
  application:
    name: claw-server
  servlet:
    multipart:
      enabled: true
      max-file-size: 200MB
      max-request-size: 200MB
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:claw}
    username: ${DB_USER:claw}
    password: ${DB_PASSWORD:claw_dev_password}
    hikari:
      maximum-pool-size: 20
      connection-timeout: 5000
  jpa:
    hibernate:
      # 表结构一律由 Flyway 管理（V1–V16 已全量应用），禁止 Hibernate 自动建表。
      # 注意：实体与迁移在 CHAR/VARCHAR、NUMERIC 精度等类型声明上存在历史漂移，
      # 在从未对接真实 PostgreSQL 的项目中 validate 会逐项阻塞启动；
      # Flyway 已完整掌管 schema，故此处用 none（Flyway 管 schema 的推荐搭配），
      # 不丢任何表结构控制权，仅跳过 Hibernate 的类型二次校验。
      ddl-auto: none
    open-in-view: false
    properties:
      hibernate:
        default_schema: claw
  flyway:
    enabled: true
    schemas: claw
    default-schema: claw
    locations: classpath:db/migration
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  # 注意：RabbitMQ 的正确前缀是 spring.rabbitmq（Spring Boot 绑定 RabbitProperties）。
  # 此前误写在 spring.data.rabbitmq 下，属于无效配置键 —— 用户名/密码被完全忽略，
  # 回落默认 guest/guest，被容器拒绝，导致 /actuator/health 永远 DOWN。
  # spring.data.* 下只有 redis 是合法前缀，勿再往里塞 rabbitmq。
  rabbitmq:
    host: ${MQ_HOST:localhost}
    port: ${MQ_PORT:5672}
    username: ${MQ_USER:claw}
    password: ${MQ_PASSWORD:claw_dev_password}
    # 连接失败不阻塞应用启动（本地/无 MQ 环境可正常起服务；MQ 恢复后由 spring-rabbit
    # 的 CachingConnectionFactory 自动重连）。监听器容器失败亦不导致上下文启动失败。
    listener:
      simple:
        auto-startup: true
        missing-queues-fatal: false

server:
  port: 8080

claw:
  security:
    # JWT 签名密钥（生产必须通过环境变量 CLAW_JWT_SECRET 注入，长度 ≥ 32 字节）
    jwt-secret: ${CLAW_JWT_SECRET:dev-only-insecure-secret-please-override-in-prod-0123456789}
    jwt-ttl-minutes: 1440            # 登录态有效期 24h
    # dev 环境短信验证码 stub：直接把验证码回显给客户端，便于联调（生产关闭）
    sms-dev-echo: true

  iot:
    emqx:
      enabled: false                        # 启用(true)后连接真实 EMQX（入站+出站全开）；默认关，走 REST 上报
      broker-url: tcp://localhost:1883      # 生产建议 ssl://host:8883 + 双向 TLS
      username: ${CLAW_IOT_EMQX_USERNAME:}
      password: ${CLAW_IOT_EMQX_PASSWORD:}
      topic: claw/telemetry/+               # 老 BMS 链路订阅主题
      client-id: claw-emqx-inbound
      down-topic: claw/iot/%s/down          # 车辆终端下行主题模板（%s = deviceNo）
      ssl:
        enabled: false                       # 开启后下行/入站以 TLS 连接（broker-url 需为 ssl://）
        truststore-path: ${CLAW_IOT_SSL_TRUSTSTORE:}      # 信任库(JKS)，导出 EMQX CA
        truststore-pass: ${CLAW_IOT_SSL_TRUSTSTORE_PASS:claw123}
        keystore-path: ${CLAW_IOT_SSL_KEYSTORE:}         # 双向 TLS 客户端证书(PKCS12)；单向可空
        keystore-pass: ${CLAW_IOT_SSL_KEYSTORE_PASS:claw123}

springdoc:
  swagger-ui:
    path: /swagger-ui.html

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when_authorized

logging:
  level:
    com.claw: INFO
    org.flywaydb: INFO
