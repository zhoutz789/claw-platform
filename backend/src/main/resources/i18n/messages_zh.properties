# =====================================================================
# 增量：补齐「代码引用但三语均缺失」的 message key（zh 定稿）
#   背景：I18nConfig.messageSource() 开启 useCodeAsDefaultMessage(true)，
#     任意 key 缺失时 Spring 不抛异常，直接把 key 原样透给客户端（含中文），
#     页面上就出现 certificate.not.found 这种裸 key。
#   本块为静态扫描 src/main/java 确认的缺口，按业务域分组；缺省放文件尾
